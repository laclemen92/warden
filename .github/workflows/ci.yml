name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks as its gate before publishing anything.
  workflow_call:

concurrency:
  # In a workflow_call, github.workflow is the caller's name, so a release run never cancels (or
  # is cancelled by) CI on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build --cache-dir=.turbo
      - run: pnpm typecheck --cache-dir=.turbo
      - run: pnpm test --cache-dir=.turbo
        timeout-minutes: 12

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        timeout-minutes: 10
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: docker compose up -d --build --wait
        timeout-minutes: 10
      # Browsers are cached per Playwright version; the system packages they need still come from
      # apt. Network steps get short timeouts and retries, so a stuck mirror fails over in minutes.
      - id: playwright
        run: echo "version=$(pnpm --filter @wardenhq/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser and system dependencies
        timeout-minutes: 8
        env:
          BROWSERS_CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$BROWSERS_CACHED" = true ]; then what=(install-deps); else what=(install --with-deps); fi
          for attempt in 1 2 3; do
            timeout 150 pnpm --filter @wardenhq/e2e exec playwright "${what[@]}" chromium && exit 0
            echo "::warning::playwright ${what[*]} attempt $attempt failed or timed out"
          done
          exit 1
      - run: pnpm e2e
        timeout-minutes: 10
        env:
          CI: true
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - if: always()
        run: docker compose down -v
