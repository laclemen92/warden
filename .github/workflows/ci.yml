name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks as its gate before publishing anything.
  workflow_call:

concurrency:
  # In a workflow_call, github.workflow is the caller's name, so a release run never cancels (or
  # is cancelled by) CI on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build --cache-dir=.turbo
      - run: pnpm typecheck --cache-dir=.turbo
      - run: pnpm test --cache-dir=.turbo
        timeout-minutes: 12

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        timeout-minutes: 10
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: docker compose up -d --build --wait
        timeout-minutes: 10
      # Browsers are cached per Playwright version. The download is retried with short timeouts;
      # the system packages come from apt, which is slow but must not be killed mid-install (the
      # orphaned apt-get would hold the dpkg lock), so the step timeout is its only limit.
      - id: playwright
        run: echo "version=$(pnpm --filter @wardenhq/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download Playwright browser
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            timeout 90 pnpm --filter @wardenhq/e2e exec playwright install chromium && exit 0
            echo "::warning::playwright browser download attempt $attempt failed or timed out"
          done
          exit 1
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: pnpm --filter @wardenhq/e2e exec playwright install-deps chromium
      - run: pnpm e2e
        timeout-minutes: 10
        env:
          CI: true
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - if: always()
        run: docker compose down -v
