name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks as its gate before publishing anything.
  workflow_call:

concurrency:
  # In a workflow_call, github.workflow is the caller's name, so a release run never cancels (or
  # is cancelled by) CI on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build --cache-dir=.turbo
      - name: Check warden.config.schema.json is up to date
        run: pnpm --filter @wardenhq/config schema:check
        timeout-minutes: 2
      - run: pnpm typecheck --cache-dir=.turbo
      - run: pnpm test --cache-dir=.turbo
        timeout-minutes: 12

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        timeout-minutes: 10
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: docker compose up -d --build --wait
        timeout-minutes: 10
      # The tests run in Microsoft's Playwright image for the installed version, which ships the
      # browser and its system packages, so CI never waits on apt mirrors.
      - id: playwright
        run: echo "version=$(pnpm --filter @wardenhq/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Pull the Playwright image
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            docker pull "mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-noble" && exit 0
            echo "::warning::Playwright image pull attempt $attempt failed"
          done
          exit 1
      - name: Run e2e tests
        timeout-minutes: 10
        run: >
          docker run --rm --network host --ipc host -e CI=true
          --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/work" -w /work/e2e
          "mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-noble"
          npx playwright test
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - if: always()
        run: docker compose down -v
