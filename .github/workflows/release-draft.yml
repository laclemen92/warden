name: Release draft

# Keeps one draft GitHub Release that previews the next version, computed from the semver:* labels
# of the PRs merged into main since the last version tag (docs/versioning.md). The draft is never
# published; releasing is still "push the tag" (docs/releasing.md), and the release workflow takes
# the draft's upgrade notes into the Release and deletes the draft. The next push to main recreates it.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/release-draft.yml']

concurrency:
  group: release-draft-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/*.test.mjs

  draft:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # PRs are collected since the last stable tag, so a release cut after an rc still carries the
      # upgrade notes of PRs merged before the rc. The version is bumped from the latest tag.
      - id: range
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD)"
          since="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*-*' HEAD 2>/dev/null || echo "$tag")"
          echo "Last version tag on main: $tag; collecting PRs since $since"
          git log --format=%H "$since..HEAD" > "$RUNNER_TEMP/shas"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "since=$since" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v8
        env:
          LAST_TAG: ${{ steps.range.outputs.tag }}
          SINCE_TAG: ${{ steps.range.outputs.since }}
        with:
          script: |
            const fs = require('node:fs');
            const { DRAFT_MARKER, draftBody, highestBump, nextVersion } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/next-version.mjs`
            );
            const { owner, repo } = context.repo;
            const lastTag = process.env.LAST_TAG;
            const sinceTag = process.env.SINCE_TAG;
            const shas = fs
              .readFileSync(`${process.env.RUNNER_TEMP}/shas`, 'utf8')
              .split('\n')
              .filter(Boolean);

            const prs = new Map();
            for (const sha of shas) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });
              for (const pr of data) {
                if (!pr.merged_at || pr.base.ref !== 'main' || prs.has(pr.number)) continue;
                prs.set(pr.number, {
                  number: pr.number,
                  title: pr.title,
                  body: pr.body,
                  labels: pr.labels.map((l) => l.name),
                });
              }
            }
            const merged = [...prs.values()].sort((a, b) => a.number - b.number);
            const bump = highestBump(merged);
            const next = nextVersion(lastTag, bump);
            core.info(`${merged.length} PRs since ${sinceTag}: ${bump} bump, next ${next ?? 'none'}`);

            const drafts = (await github.paginate(github.rest.repos.listReleases, { owner, repo })).filter(
              (r) => r.draft && (r.body ?? '').includes(DRAFT_MARKER),
            );
            if (next === null) {
              for (const d of drafts) await github.rest.repos.deleteRelease({ owner, repo, release_id: d.id });
              return;
            }

            const { data: generated } = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: `v${next}`,
              target_commitish: 'main',
              previous_tag_name: sinceTag,
            });
            const release = {
              owner,
              repo,
              tag_name: `v${next}`,
              target_commitish: 'main',
              name: `v${next} (draft)`,
              body: draftBody({ repo: `${owner}/${repo}`, lastTag: sinceTag, next, bump, prs: merged, generatedNotes: generated.body }),
              draft: true,
              prerelease: false,
            };
            const [keep, ...stale] = drafts;
            if (keep) {
              await github.rest.repos.updateRelease({ ...release, release_id: keep.id });
            } else {
              await github.rest.repos.createRelease(release);
            }
            for (const d of stale) await github.rest.repos.deleteRelease({ owner, repo, release_id: d.id });
            await core.summary.addRaw(`Suggested next version: **v${next}** (${bump} since ${sinceTag})`).write();
