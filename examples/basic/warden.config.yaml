# Warden exposes every introspected table and column by default.
# This file narrows and customizes what is exposed.

schemas: [public]

defaults:
  expose: all # all | none (only tables listed below)
  newColumns: visible # visible | hidden | readOnly: columns not mentioned here
  read: all # all | granted (reading requires a `read` grant)
  # none: hard delete is off unless a table sets allowDelete: true | granted: delete grants apply
  delete: none
  # Writes that must say why: an "Internal note" in the UI, kept in the audit log. A table's own
  # requireReason overrides this ([] makes reasons optional there).
  requireReason: [create, update, delete]
  reasonMinLength: 10 # after trimming, so "." or "fix" doesn't count
  # Where shared grid views come from: config (tables.<table>.views only), ui (shared in the app
  # by roles with admin: [views]), or both.
  sharedViews: both

tables:
  companies:
    displayField: name
    defaultSort: { column: name }
    searchable: [name, domain]
    # Primary keys are read-only on update unless updatablePrimaryKey is true, and keys with a
    # default are read-only on create too unless insertablePrimaryKey is true (neither can apply
    # here anyway: the id is GENERATED ALWAYS). Note that deleting a company also deletes its
    # orders (`on delete cascade`) without checking orders permissions or auditing those rows.
    updatablePrimaryKey: false
    insertablePrimaryKey: false

  users:
    label: Users
    displayField: email
    defaultSort: { column: created_at, direction: desc }
    searchable: [email, full_name]
    columns:
      password_hash: { hidden: true }
      created_at: { readOnly: true, label: Joined }
      # Field-level rules: everyone sees role but only admins change it, and viewers don't see
      # when someone last logged in.
      role: { writableBy: [admin] }
      last_login_at: { readableBy: [admin, ops] }
    # Hard delete is off by default; roles granted `users: [delete]` may delete users. Deleting a
    # user sets orders.user_id to null (`on delete set null`), which Warden warns about at startup.
    allowDelete: true

  orders:
    defaultSort: { column: placed_at, direction: desc }
    # Columns the grid shows first; the rest follow (key, display field, timestamps, table order).
    columnOrder: [status, placed_at]
    columns:
      placed_at: { readOnly: true }
    # Nobody may create or delete orders, whatever their role grants.
    deny: [create, delete]
    # Shared grid views, reviewed and versioned with this file. Read-only in the app; build one in
    # the grid and use Views > Export to config to get its YAML. Links: ?view=config:<key>.
    views:
      - key: paid-orders
        name: Paid orders
        filter: { field: status, op: eq, value: paid }
        sort: [{ column: placed_at, direction: desc }]
        columns: [id, status, total, currency, placed_at]
        sidebar: true # its own entry in the sidebar, under Queues
      - key: refunds-and-cancellations
        name: Refunds and cancellations
        filter:
          or:
            - { field: status, op: in, value: [refunded, cancelled] }
            - { field: total, op: eq, value: 0 }
        sort: [{ column: placed_at, direction: asc }]

  # Soft delete: deleting sets a column instead of removing the row, under the same `delete`
  # grant, whether or not hard delete is on. Deleted rows are left out of lists unless "Show
  # deleted" is on, and roles granted `update` may restore them. `by` gets the actor's user id.
  # The example schema has no such table, so this is left commented out.
  # certificates:
  #   softDelete: { column: deleted_at, by: deleted_by }

# Create, update and delete are denied unless a role grants them. `*` never grants delete: it is
# granted per table, on tables that set allowDelete.
roles:
  viewer: { grants: { '*': [read] } }
  admin:
    grants:
      '*': [read, create, update, export]
      users: [delete]
    # The schema drift page shows every table and column, including hidden ones. The audit log
    # page searches every change made through Warden. The roles page can give anyone any role,
    # admin included. `views` lets admins share saved grid views with everyone.
    admin: [schema, audit, roles, views]
    # Custom actions (examples/basic/actions, loaded from WARDEN_ACTIONS) this role may run.
    actions: ['*']
  ops:
    grants:
      users: [read, update]
      companies: [read, create, update]
      orders: [update]
    # Running an action doesn't need the table grants it writes with, but a `deny` disables it.
    actions: [move-user, deactivate-users]

# Settings that override what an action's definition says. Actions require a reason unless their
# definition sets requireReason: false; this keeps it required even if the definition changes.
actions:
  cancel-stale-orders:
    requireReason: true

# Who may sign in, and with which roles (required). Users matching no rule are denied, so the
# mock IdP's `outsider` (example.org, no groups) can't sign in. `allowAll: true` would let every
# IdP user in, with no roles unless a rule gives some; only use it if the IdP restricts sign-in.
access:
  groups:
    warden-viewers: [viewer]
    warden-editors: [ops]
    warden-admins: [admin]
  emailDomains:
    example.com: [viewer]

# Where the audit log is written: warden.audit_log (the default), or a table you own. With
# `store: table`, columns map each audit field to your column (left out, warden.audit_log's names
# are used), and source tags Warden's entries in a table your application writes to as well. The
# table is never exposed, and if it doesn't match, changes are refused until it does
# (docs/config.md#audit, docs/database.md#writing-the-audit-log-to-your-own-table).
audit:
  store: warden
  # store: table
  # table: public.change_log
  # columns: { id: id, occurredAt: created_at, actorSubject: actor_sub, action: action,
  #            entity: table_name, recordId: record_id, diff: diff, details: details }
  # source: { column: source, value: warden }

# Map each signed-in user to their row in `users` by verified email. The id is recorded on audit
# entries, passed to actions as actor.userId, and set as warden.actor_id in every write
# transaction for triggers. The mock IdP's users have no row here, so they get no id.
actor:
  table: users
  matchColumn: email
  idColumn: id
  required: false
